[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-learning-labs"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.4.6",
    "torch>=2.7,<3",
]

[project.optional-dependencies]
lab = ["pytest>=8,<10", "fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.30,<1"]
hf = ["transformers>=4.51,<5", "safetensors>=0.4.3,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["real_model: optional tests that load real Qwen3 weights"]
